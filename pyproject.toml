[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-motion-challenge"
version = "1.0.0"
requires-python = ">=3.10,<3.13"
description = "A reproducible benchmark for classifying simulated particle tracks"
dependencies = [
  "numpy==1.26.4", "scikit-learn==1.5.2", "scipy==1.13.1",
  "nbclient==0.10.2", "nbformat==5.10.4", "ipykernel==6.29.5",
]

[tool.setuptools]
packages = ["particle_motion_challenge"]
package-dir = {particle_motion_challenge = "."}

[tool.setuptools.package-data]
particle_motion_challenge = ["DATA_LICENSE.txt", "reference.ipynb"]
