name: Verify motion challenge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
      - name: Install the challenge
        run: python -m pip install -c constraints-linux.txt .
      - name: Check invalid and trivial submissions
        run: python -m unittest discover -s tests -v
      - name: Run twice from scratch and compare data, predictions and grades
        run: |
          python run.py
          sha256sum work/public/* work/private/* work/submission.csv work/report.json > "$RUNNER_TEMP/first.sha256"
          rm -r work
          python run.py
          sha256sum --check "$RUNNER_TEMP/first.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-result
          path: |
            work/reference.executed.ipynb
            work/report.json
            work/submission.csv
